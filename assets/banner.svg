    <g transform="translate(520,400) scale(0.5)"><use href="#star" class="tw" style="animation-delay:-0.52s" fill="#ffffff"/></g>

    <!-- wordmark -->
    <text x="78" y="126" font-size="74" font-weight="900" letter-spacing="-2.5" fill="#3dffb0" filter="url(#glow)" opacity="0.75">claude-gamedev-kit</text>
    <text x="78" y="126" font-size="74" font-weight="900" letter-spacing="-2.5" fill="url(#title)">claude-gamedev-kit</text>
    <text x="81" y="172" font-size="28" font-weight="700" fill="#ffffff">Make a game with Claude Code, one playable cycle at a time</text>
    <rect class="sweep" x="0" y="60" width="240" height="126" fill="url(#shine)" opacity="0.16" transform="skewX(-20)"/>

    <rect class="pulse" x="80" y="278" width="150" height="56" rx="28" fill="#3dffb0" filter="url(#glow)"/>
    <rect x="80" y="278" width="150" height="56" rx="28" fill="url(#you)" stroke="#eafff6" stroke-width="2"/>
    <text x="155" y="315" font-size="25" font-weight="900" text-anchor="middle" fill="#04261a">Goal</text>
    <text x="155" y="368" font-size="19" font-weight="800" text-anchor="middle" fill="#5dffc0">you</text>
