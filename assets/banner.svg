    <rect x="258" y="278" width="150" height="56" rx="28" fill="#8ad8ff" opacity="0.28" filter="url(#soft)"/>
    <rect x="258" y="278" width="150" height="56" rx="28" fill="#0d1b22" stroke="#8ad8ff" stroke-opacity="0.85" stroke-width="2"/>
    <text x="333" y="315" font-size="25" font-weight="800" text-anchor="middle" fill="#f2fbff">Spec</text>
    <text x="333" y="368" font-size="19" font-weight="600" text-anchor="middle" fill="#e6f3f8">systems-designer</text>
    <path d="M413,306 H430 M423,299 L431,306 L423,313" fill="none" stroke="#ffd24a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
