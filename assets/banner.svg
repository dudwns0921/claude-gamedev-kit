    <text x="689" y="368" font-size="19" font-weight="600" text-anchor="middle" fill="#e6f3f8">developer</text>
    <path d="M769,306 H786 M779,299 L787,306 L779,313" fill="none" stroke="#ffd24a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="792" y="278" width="150" height="56" rx="28" fill="#8ad8ff" opacity="0.28" filter="url(#soft)"/>
    <rect x="792" y="278" width="150" height="56" rx="28" fill="#0d1b22" stroke="#8ad8ff" stroke-opacity="0.85" stroke-width="2"/>
    <text x="867" y="315" font-size="25" font-weight="800" text-anchor="middle" fill="#f2fbff">Build</text>
    <text x="867" y="368" font-size="19" font-weight="600" text-anchor="middle" fill="#e6f3f8">developer</text>
    <path d="M947,306 H964 M957,299 L965,306 L957,313" fill="none" stroke="#ffd24a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect class="pulse" x="970" y="278" width="150" height="56" rx="28" fill="#3dffb0" filter="url(#glow)"/>
    <rect x="970" y="278" width="150" height="56" rx="28" fill="url(#you)" stroke="#eafff6" stroke-width="2"/>
    <text x="1045" y="315" font-size="25" font-weight="900" text-anchor="middle" fill="#04261a">Play</text>
    <text x="1045" y="368" font-size="19" font-weight="800" text-anchor="middle" fill="#5dffc0">you</text>

    <!-- play → fix → play -->
    <path d="M1045,270 C1045,214 867,214 867,264" fill="none" stroke="#ff8ad1" stroke-width="7" filter="url(#soft)" opacity="0.7"/>
    <path class="dash" d="M1045,270 C1045,214 867,214 867,264" fill="none" stroke="#ff8ad1" stroke-width="3" stroke-linecap="round"/>
    <path d="M859,256 L867,267 L875,256" fill="none" stroke="#ff8ad1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="956" y="212" font-size="19" font-weight="800" text-anchor="middle" fill="#ffc4e8">fix what you found</text>
