<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>claude-gamedev-kit — goal, spec, design, plan, build, play</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07110e"/><stop offset="0.55" stop-color="#0b2a22"/><stop offset="1" stop-color="#1a1033"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3dffb0"/><stop offset="0.45" stop-color="#d8ff5a"/><stop offset="0.8" stop-color="#ffd24a"/><stop offset="1" stop-color="#ff8ad1"/>
    </linearGradient>
    <linearGradient id="you" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5dffc0"/><stop offset="1" stop-color="#16b877"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3dffb0" stop-opacity="0.35"/><stop offset="1" stop-color="#3dffb0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b06cff" stop-opacity="0.32"/><stop offset="1" stop-color="#b06cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#3dffb0" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="soft" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="card"><rect x="6" y="6" width="1188" height="408" rx="28"/></clipPath>
    <path id="star" d="M0,-10 L2.4,-2.4 L10,0 L2.4,2.4 L0,10 L-2.4,2.4 L-10,0 L-2.4,-2.4 Z"/>
  </defs>
  <style>
    .tw { animation: tw 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes tw { 0%,100% { opacity: .15; transform: scale(.6); } 50% { opacity: 1; transform: scale(1.15); } }
    .sweep { animation: sweep 5s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-500px); } 60%,100% { transform: translateX(1300px); } }
    .pulse { animation: pulse 2.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
    .dash { stroke-dasharray: 10 12; animation: dash 1.2s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -22; } }
  </style>

  <g clip-path="url(#card)">
    <rect x="6" y="6" width="1188" height="408" fill="url(#bg)"/>
    <rect x="6" y="6" width="1188" height="408" fill="url(#grid)"/>
    <ellipse cx="250" cy="120" rx="420" ry="230" fill="url(#spot)"/>
    <ellipse cx="1040" cy="330" rx="380" ry="230" fill="url(#spot2)"/>

