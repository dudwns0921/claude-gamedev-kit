    <text x="78" y="84" font-size="46" font-weight="900" letter-spacing="-1.2" fill="#3dffb0" filter="url(#glow)" opacity="0.6">Every game leaves the next one better off</text>
    <text x="78" y="84" font-size="46" font-weight="900" letter-spacing="-1.2" fill="url(#title)">Every game leaves the next one better off</text>
    <text x="80" y="120" font-size="23" font-weight="600" fill="#ffffff">What tripped you carries into every game after it</text>
    <rect class="sweep" x="0" y="40" width="240" height="100" fill="url(#shine)" opacity="0.16" transform="skewX(-20)"/>

